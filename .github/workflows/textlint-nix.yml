name: Textlint Nix dependencies
on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .textlintrc.json
      - nix/textlint/**
      - scripts/update-textlint-deps.py
      - scripts/test_update_textlint_deps.py
      - .github/workflows/textlint-nix.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .textlintrc.json
      - nix/textlint/**
      - scripts/update-textlint-deps.py
      - scripts/test_update_textlint_deps.py
      - .github/workflows/textlint-nix.yml
permissions:
  contents: read
jobs:
  textlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Test the hash update guard
        run: python3 scripts/test_update_textlint_deps.py
      - name: Verify lockfile hash
        run: nix run .#update-textlint-deps -- --check
      - name: Build and start the pinned textlint runtime
        run: |
          textlint_path=$(nix build .#textlint --no-link --print-out-paths)
          "$textlint_path/bin/textlint" --version
          printf '%s\n' 'これは確認用の文章です。' | "$textlint_path/bin/textlint" --stdin --stdin-filename smoke.md --config .textlintrc.json
