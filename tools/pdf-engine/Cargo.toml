[package]
name = "track-pdf-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
xberg = { version = "=1.2.6", default-features = false, features = ["pdf", "tokio-runtime"] }

[profile.release]
strip = true
